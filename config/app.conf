# Model: RGB 640x640, output [1,10,8400], six NEU classes
model=/opt/rk3588_ai/model/best_fp16.rknn

# Detection thresholds
confidence=0.25
nms=0.45

# Background snapshots
snapshot_enabled=true
snapshot_dir=/opt/rk3588_ai/captures
snapshot_interval_ms=5000

# Performance statistics
stats_interval_ms=1000

# Exit after camera timeout or consecutive processing failures
camera_timeout_ms=5000
max_errors=10

# Per-frame debug messages
debug=false

# TCP reporting
network_enabled=true
server_ip=192.168.88.100
server_port=9000
device_id=RK3588_001
report_interval_ms=1000