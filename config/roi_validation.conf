# Model: RGB 640x640, output [1,10,8400], six NEU classes
model=/opt/rk3588_ai/model/best_fp16.rknn

# Detection thresholds
confidence=0.25
nms=0.45

# Background snapshots
snapshot_enabled=true
snapshot_dir=/opt/rk3588_ai/captures
snapshot_interval_ms=5000

# Performance statistics
stats_interval_ms=1000

# Exit after camera timeout or consecutive processing failures
camera_timeout_ms=5000
max_errors=10

# Per-frame debug messages
debug=true

# TCP reporting
network_enabled=true
server_ip=192.168.88.100
server_port=9000
device_id=RK3588_001
report_interval_ms=1000

# Local event storage
event_max_count=200
event_min_free_mb=128

# ROI coordinates in the original camera image
roi_enabled=true
roi_x=960
roi_y=540
roi_width=1920
roi_height=1080

# Grayscale / Sobel / Canny diagnostics
edge_analysis_enabled=true
edge_low_threshold=50
edge_high_threshold=100

# Restart through external supervisor after a progress timeout
watchdog_enabled=true
watchdog_timeout_ms=15000

# Camera: tightly packed NV12
camera_device=/dev/video22
camera_width=3840
camera_height=2160

# 0 preserves the current driver frame interval
camera_fps=0
# Parent directory must already exist
alarm_dir=/opt/rk3588_ai/alarms